<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0e1612;--card:#16221c;--ink:#e5efe9;--mut:#9db1a5;--line:#263830;--soft:#1b3026}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3,.lg{font-family:Outfit,"Segoe UI",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;display:inline-flex;gap:8px;align-items:center;justify-content:center}

.nav{display:flex;align-items:center;gap:22px;padding:14px 0;flex-wrap:wrap}.nav .links{display:flex;gap:22px;flex:1;margin-left:18px}.nav .links a{color:var(--mut);cursor:pointer}.nav .links a:hover{color:var(--g)}.mb{display:none}
.logo{display:flex;align-items:center;gap:8px;font:800 22px Outfit,sans-serif;color:var(--dg);cursor:pointer}.logo svg{width:30px;height:30px}

.hero{background:linear-gradient(135deg,var(--dg),#14584a 60%,var(--t));color:#fff;border-radius:28px;padding:48px 36px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;margin-top:6px}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05}.hero p{color:#cfe9db;max-width:46ch;font-size:17px}
.orb{aspect-ratio:1;max-width:340px;margin:auto;position:relative;width:100%}.orb svg{width:100%;height:100%}.orb circle{stroke-dasharray:700;stroke-dashoffset:700;animation:dr 1.6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.orb b{position:absolute;font-size:34px;background:#ffffff22;border-radius:16px;padding:8px 12px;backdrop-filter:blur(4px)}
@media(prefers-reduced-motion:reduce){.orb circle{animation:none;stroke-dashoffset:0}*{scroll-behavior:auto!important}}
.sec{padding:56px 0 0}.sec h2{font-size:clamp(26px,3.5vw,36px);margin-bottom:6px}.mut{color:var(--mut)}
.st{display:flex;gap:12px;align-items:flex-start}.num{background:var(--soft);color:var(--g);font:800 18px Outfit;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.cat{text-align:center;transition:transform .2s,border-color .2s;cursor:pointer}.cat:hover{transform:translateY(-4px);border-color:var(--g)}.cat i{font-style:normal;font-size:34px;display:block}
.band{background:var(--dg);color:#fff;border-radius:24px;padding:30px;margin-top:56px}.band b{font:800 34px Outfit;display:block;color:#7be0a4}
.cta{background:linear-gradient(120deg,var(--g),var(--t));color:#fff;border-radius:24px;padding:40px;text-align:center;margin-top:56px}
footer{margin-top:56px;padding:28px 0 90px;color:var(--mut);border-top:1px solid var(--line);font-size:14px}
.lw{min-height:80vh;display:grid;place-items:center;padding:20px}.lw .card{max-width:400px;width:100%;padding:28px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px rgba(46,158,91,.18)}.in.bad{border-color:#d33}.err{color:#d33;font-size:12px;margin-top:3px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .ni{display:flex;gap:10px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--mut);font-weight:600;transition:background .15s}aside .ni:hover{background:var(--soft)}aside .ni.on{background:var(--soft);color:var(--g)}
.main{padding:22px 24px 100px;max-width:1100px;width:100%}.main>h1{font-size:28px;margin-bottom:4px}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:8}

.sc b{display:block;font:800 28px Outfit;color:var(--dg)}:root[data-theme="dark"] .sc b{color:#7be0a4}.sc span{color:var(--mut);font-size:13px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
.stp{display:flex;gap:6px;margin:14px 0}.stp div{flex:1;text-align:center;font-size:12px;color:var(--mut);border-top:4px solid var(--line);padding-top:6px}.stp .on{border-color:var(--g);color:var(--g);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.opt{border:1.5px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center;cursor:pointer;font-size:13px;transition:.15s}.opt:hover{border-color:var(--g)}.opt.on{background:var(--g);color:#fff;border-color:var(--g)}.opt.x{opacity:.45;text-decoration:line-through;pointer-events:none}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.tl{margin:14px 0;padding:0;list-style:none}.tl li{display:flex;gap:14px;padding-bottom:20px;position:relative;color:var(--mut)}.tl li:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}.tl li:last-child:before{display:none}
.tl i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--card);flex:none;z-index:1}
.tl .d{color:var(--ink)}.tl .d i{background:var(--g);border-color:var(--g);color:#fff}.tl .d:before{background:var(--g)}.tl .c{color:var(--ink);font-weight:700}.tl .c i{background:#fff;border-color:var(--g);color:var(--g);animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px rgba(46,158,91,.2)}}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:10px}.bars div{flex:1;background:linear-gradient(var(--t),var(--g));border-radius:8px 8px 0 0;position:relative;min-height:4px;transition:opacity .15s}.bars div:hover{opacity:.8}.bars small{position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:var(--mut);font-size:11px}
.hb{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:13px}.hb em{width:84px;font-style:normal;color:var(--mut)}.hb i{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--t),var(--g))}
.mod{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:30}.mod .card{max-width:480px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--dg);color:#fff;padding:11px 18px;border-radius:12px;z-index:40;box-shadow:0 8px 24px #0004;max-width:92%}.toast.e{background:#c62828}
.ok{width:92px;height:92px;margin:0 auto 14px}.ok circle{fill:var(--soft)}.ok path{fill:none;stroke:var(--g);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr2 .7s .2s forwards}@keyframes dr2{to{stroke-dashoffset:0}}
.sp{width:16px;height:16px;border:2.5px solid #fff5;border-top-color:#fff;border-radius:50%;animation:rt .7s linear infinite}@keyframes rt{to{transform:rotate(1turn)}}
.emp{text-align:center;padding:30px;color:var(--mut)}.emp i{font-style:normal;font-size:40px;display:block}
@media(max-width:899px){.app{display:block}aside{display:none}.bn{display:flex}.main{padding:16px 14px 100px}.hero{grid-template-columns:1fr;padding:30px 22px}.nav .links{display:none;order:5;flex-basis:100%;flex-direction:column;margin:0;gap:10px}.nav .links.show{display:flex}.mb{display:inline-flex;margin-left:auto}.nav .dsk{display:none}.two{grid-template-columns:1fr}}
</style></head>

let R=[

{id:'ECO-20260928-00119',cu:'Ananya Iyer',d:'30 Sep 2026',slot:SL[3],it:'Samsung 32" LED TV',w:7.5,st:5,a:'Flat 402, Lotus Residency, Dharampeth, Nagpur 440010'},
{id:'ECO-20260915-00108',cu:'Ananya Iyer',d:'16 Sep 2026',slot:SL[0],it:'HP LaserJet printer, 4 cables',w:9.1,st:5,a:'Flat 402, Lotus Residency, Dharampeth, Nagpur 440010'},
{id:'ECO-20260902-00097',cu:'Ananya Iyer',d:'03 Sep 2026',slot:SL[2],it:'iPhone 8, 3 old phones',w:0.9,st:5,a:'Flat 402, Lotus Residency, Dharampeth, Nagpur 440010'},
{id:'ECO-20260821-00083',cu:'Ananya Iyer',d:'22 Aug 2026',slot:SL[4],it:'Desktop PC with monitor',w:12.2,st:5,a:'Flat 402, Lotus Residency, Dharampeth, Nagpur 440010'}];
const X=[{id:'ECO-20261006-00123',cu:'Rohit Verma',d:'09 Oct 2026',w:3.1,st:1,it:'2 phones, 1 laptop'},{id:'ECO-20261005-00122',cu:'Meera Shah',d:'08 Oct 2026',w:14.0,st:2,it:'Printer, UPS battery'},{id:'ECO-20261004-00120',cu:'Sanjay Rao',d:'07 Oct 2026',w:5.4,st:4,it:'LED TV 24"'}];
const COL=[['Ravi Kumar','Nagpur Central','On duty',3],['Imran Qureshi','Nagpur East','On duty',2],['Divya Menon','Nagpur West','Off duty',0]];

let J=[{id:'ECO-20261007-00121',cu:'Rohit Verma',ph:'+91 98220 11457',a:'12 Shivaji Nagar, Nagpur 440010',it:'2 phones, 1 laptop',w:3.1,t:SL[1],s:0},{id:'ECO-20261007-00122',cu:'Neha Deshmukh',ph:'+91 97650 44012',a:'B-7 Hingna Road, Nagpur 440016',it:'Printer, 3 cables',w:8.4,t:SL[3],s:1},{id:'ECO-20261007-00117',cu:'Karan Patel',ph:'+91 98900 22318',a:'44 Civil Lines, Nagpur 440001',it:'LED TV 32"',w:7.5,t:SL[0],s:4}];
let S={v:'home',menu:0,step:1,err:0,load:0,date:'',slot:'',cur:R[0].id,q:'',f:'All',addr:{},items:[{c:'Laptops',n:'',q:1,cond:'Working',w:'',img:''}]};
const DATES=[...Array(6)].map((_,i)=>{const d=new Date(2026,9,8+i);return{k:d.toDateString(),l:d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}),i}});
const badge=s=>`<span class="bd ${s<2?'a':s<5?'b':''}">${SN[s]}</span>`;
const kg=x=>+x.toFixed(1);
function toast(m,er){const t=document.createElement('div');t.className='toast'+(er?' e':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(h){document.body.insertAdjacentHTML('beforeend',`<div class="mod" data-a="x"><div class="card">${h}</div></div>`)}
const go=v=>{S.v=v;S.menu=0;S.err=0;scrollTo(0,0);render()};

function pubNav(){return`<div class="pub"><div class="nav"><div class="logo" data-go="home">${LOGO}Eco Loop</div><div class="links ${S.menu?'show':''}"><a data-go="home">Home</a><a data-sc="how">How It Works</a><a data-sc="what">What We Collect</a><a data-sc="about">About</a></div><button class="btn o s dsk" data-go="login">Login</button><button class="btn s dsk" data-go="sch">Schedule a Pickup</button><button class="btn o s mb" data-a="menu">☰ Menu</button></div></div>`}
function home(){return pubNav()+`<div class="pub"><section class="hero"><div><h1>Give Your E-Waste a Second Life.</h1><p>Book a free doorstep pickup for old phones, laptops and appliances. We collect, responsibly recycle and show you the impact.</p><p><button class="btn w" data-go="sch">Schedule a Pickup</button> <button class="btn o" style="color:#fff;border-color:#fff8" data-go="login">Login</button></p></div><div class="orb"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="78" fill="none" stroke="#7be0a4" stroke-width="10" stroke-linecap="round" stroke-dasharray="700"/></svg><b style="left:6%;top:14%">📱</b><b style="right:4%;top:22%">💻</b><b style="left:34%;bottom:2%">🔋</b><b style="left:34%;top:38%;font-size:42px">♻️</b></div></section>
<section class="sec" id="how"><h2>How it works</h2><p class="mut">Four simple steps from clutter to clean impact.</p><div class="grid w" style="margin-top:16px">${[['Request a Pickup','Tell us what you have and pick a time slot.'],['We Collect','A verified collector arrives at your door.'],['We Recycle','Items go to certified recycling partners.'],['You Make an Impact','See the kilograms and CO₂ you saved.']].map((x,i)=>`<div class="card st"><span class="num">${i+1}</span><div><b>${x[0]}</b><br><span class="mut">${x[1]}</span></div></div>`).join('')}</div></section>
<section class="sec" id="what"><h2>What we collect</h2><p class="mut">If it has a plug or a battery, we likely take it.</p><div class="grid" style="margin-top:16px">${CATS.map(c=>`<div class="card cat" data-go="sch"><i>${c[1]}</i><b>${c[0]}</b></div>`).join('')}</div></section>
<section class="band"><div class="grid">${[['842 kg','e-waste recycled'],['3,120','devices recycled'],['1,263 kg','CO₂ saved'],['1,480','pickups completed']].map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join('')}</div></section>
<section class="sec" id="about"><h2>About Eco Loop</h2><p class="mut" style="max-width:70ch">Eco Loop started in Nagpur with one goal: make responsible e-waste disposal as easy as ordering a ride. Every pickup is handled by trained collectors and every item reaches a licensed recycler.</p></section>
<section class="cta"><h2>Recycle Today. Renew Tomorrow.</h2><p>Your next pickup takes under two minutes to book.</p><button class="btn w" data-go="sch">Schedule a Pickup</button></section>
<footer>© 2026 Eco Loop · hello@ecoloop.in · Nagpur, Maharashtra<br>Prototype demo: <a data-go="a-ov"><u>Admin view</u></a> · <a data-go="coll"><u>Collector view</u></a></footer></div>`}

 return`<div class="app"><aside><div class="logo" style="padding:4px 8px 14px" data-go="home">${LOGO}Eco Loop</div>${nv}<div style="margin-top:auto"><div class="mut" style="font-size:12px;padding:6px 12px">Prototype views</div><div class="ni" data-go="dash">🙋 Customer</div><div class="ni" data-go="a-ov">🛠️ Admin</div><div class="ni" data-go="coll">🚚 Collector</div><div class="ni" data-a="theme">🌓 Theme</div><div class="ni" data-go="home">↩ Log out</div></div></aside><div class="main"><h1>${title}</h1><p class="mut" style="margin:0 0 16px">${sub||''}</p>${body}</div><div class="bn">${items.slice(0,5).map(i=>`<div class="${S.v===i[0]?'on':''}" data-go="${i[0]}"><span style="font-size:18px">${i[2]}</span>${i[1].split(' ')[0]}</div>`).join('')}</div></div>`}

 return shell(CN,`<p><button class="btn" data-go="sch">+ Schedule New Pickup</button></p><br>${stat({'Total pickups':m.length,'Pending pickups':m.filter(r=>r.st<4).length,'Completed pickups':done().length,'E-waste recycled':w+' kg'})}<div class="grid w"><div class="card"><h3>Recent pickup requests</h3>${m.slice(0,4).map(r=>`<div class="row"><div><b>${r.id}</b><br><span class="mut">${r.d} · ${e(r.it)}</span></div>${badge(r.st)}</div>`).join('')}</div><div class="card" style="background:linear-gradient(135deg,var(--dg),var(--t));color:#fff"><h3>Your impact</h3><p style="font:800 38px Outfit;margin:8px 0">${kg(w*1.5)} kg CO₂</p><p>saved by recycling ${w} kg of e-waste. Equal to ${Math.round(w*1.5/0.06)} km not driven.</p></div></div>`,'Welcome back, Ananya 👋','Here is what is happening with your e-waste.')}

function sch(){const st=S.step;let b='';
 const bar=`<div class="stp">${['E-Waste Details','Pickup Address','Schedule','Review'].map((x,i)=>`<div class="${st>=i+1?'on':''}">${i+1}. ${x}</div>`).join('')}</div>`;
 if(st===1)b=S.items.map((it,i)=>`<div class="card" style="margin-bottom:12px"><div class="row" style="border:0;padding:0"><b>Item ${i+1}</b>${S.items.length>1?`<button class="btn o s" data-a="rm" data-v="${i}">Remove</button>`:''}</div><label>Category</label><div class="og">${CATS.map(c=>`<div class="opt ${it.c===c[0]?'on':''}" data-a="cat" data-v="${i}|${c[0]}">${c[1]} ${c[0]}</div>`).join('')}</div><div class="two"><div><label>Item name</label><input class="in ${fv(0,!it.n)}" data-i="${i}" data-k="n" value="${e(it.n)}" placeholder="e.g. Dell Inspiron 15"></div><div><label>Quantity</label><input class="in" type="number" min="1" data-i="${i}" data-k="q" value="${it.q}"></div><div><label>Condition</label><select class="in" data-i="${i}" data-k="cond">${['Working','Partially Working','Damaged','Not Working'].map(c=>`<option ${it.cond===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Estimated weight (kg)</label><input class="in ${fv(0,!(+it.w>0))}" type="number" step="0.1" data-i="${i}" data-k="w" value="${it.w}" placeholder="2.5"></div></div><label>Upload image</label><input class="in" type="file" accept="image/*" data-img="${i}">${it.img?`<div class="mut" style="font-size:13px">📎 ${e(it.img)}</div>`:''}${S.err&&(!it.n||!(+it.w>0))?'<div class="err">Add an item name and a weight above 0.</div>':''}</div>`).join('')+`<button class="btn o" data-a="add">+ Add another item</button>`;
 if(st===2){const A=S.addr,f=(k,l,ph)=>`<div><label>${l}</label><input class="in ${fv(0,!A[k])}" data-ad="${k}" value="${e(A[k]||'')}" placeholder="${ph}"></div>`;b=`<div class="card"><div class="two">${f('line','Full address','Flat 402, Lotus Residency')}${f('area','Area','Dharampeth')}${f('city','City','Nagpur')}${f('state','State','Maharashtra')}${f('pin','Pincode','440010')}${f('ph','Phone number','+91 98765 43210')}</div><label>Landmark (optional)</label><input class="in" data-ad="lm" value="${e(A.lm||'')}" placeholder="Near City Centre Mall">${S.err?'<div class="err">Fill in every required field. Pincode must be 6 digits.</div>':''}</div>`}
 if(st===3)b=`<div class="card"><label>Select date</label><div class="og">${DATES.map(d=>`<div class="opt ${S.date===d.k?'on':''}" data-a="date" data-v="${d.k}">${d.l}</div>`).join('')}</div><label>Time slot ${S.date?'':'<span class="mut">(pick a date first)</span>'}</label><div class="og">${SL.map((s,j)=>{const di=DATES.find(d=>d.k===S.date),full=di&&(di.i+j)%4===0;return`<div class="opt ${S.slot===s?'on':''} ${!S.date||full?'x':''}" data-a="slot" data-v="${s}">${s}<br><small>${full?'Full':'Available'}</small></div>`}).join('')}</div>${S.err?'<div class="err">Choose a date and an available time slot.</div>':''}</div>`;
 if(st===4){const w=kg(S.items.reduce((a,i)=>a+i.q*i.w,0)),A=S.addr;b=`<div class="card"><h3>Review your pickup</h3>${S.items.map(i=>`<div class="row"><span>${e(i.n)} <span class="mut">(${i.c}, ${i.cond})</span></span><b>${i.q} × ${i.w} kg</b></div>`).join('')}<div class="row"><span>Estimated weight</span><b>${w} kg</b></div><div class="row"><span>Address</span><b style="text-align:right">${e(A.line)}, ${e(A.area)}, ${e(A.city)} ${e(A.pin)}</b></div><div class="row"><span>Pickup date</span><b>${S.date}</b></div><div class="row"><span>Time slot</span><b>${S.slot}</b></div></div>`}
 return shell(CN,bar+b+`<p style="display:flex;gap:10px;margin-top:16px">${st>1?'<button class="btn o" data-a="back">Back</button>':''}${st<4?'<button class="btn" data-a="next">Continue</button>':`<button class="btn" data-a="confirm" ${S.load?'disabled':''}>${S.load?'<span class="sp"></span>Confirming':'Confirm Pickup'}</button>`}</p>`,'Schedule a pickup','Four quick steps. It takes about two minutes.')}

function conf(){const r=R.find(x=>x.id===S.cur);return shell(CN,`<div class="card" style="max-width:560px;margin:auto;text-align:center"><svg class="ok" viewBox="0 0 92 92"><circle cx="46" cy="46" r="44"/><path d="M28 47l12 12 25-27"/></svg><h2>Pickup Request Successfully Created!</h2><p class="mut">We have sent a confirmation to your phone.</p><p style="font:800 24px Outfit;color:var(--g)">${r.id}</p><div style="text-align:left"><div class="row"><span>Pickup date</span><b>${r.d}</b></div><div class="row"><span>Time slot</span><b>${r.slot}</b></div><div class="row"><span>Address</span><b style="text-align:right">${e(r.a)}</b></div><div class="row"><span>Status</span>${badge(r.st)}</div></div><p style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn" data-go="trk">Track Pickup</button><button class="btn o" data-go="dash">Back to Dashboard</button></p></div>`,'All set','')}
function trk(){const r=R.find(x=>x.id===S.cur)||R[0];
 return shell(CN,`<div class="card"><div class="row" style="border:0"><select class="in" style="max-width:320px" id="sel">${mine().map(x=>`<option ${x.id===r.id?'selected':''}>${x.id}</option>`).join('')}</select>${badge(r.st)}</div><ul class="tl">${SN.map((s,i)=>`<li class="${i<r.st?'d':i===r.st?'c':''}"><i>${i<r.st?'✓':i+1}</i><div>${s}<br><small class="mut">${i<=r.st?(i===r.st?'Current status':'Done'):'Upcoming'}</small></div></li>`).join('')}</ul>${r.st>=2?`<div class="row" style="background:var(--soft);border-radius:12px;padding:12px"><div>🚚 <b>Ravi Kumar</b> · MH-31 Eco Van<br><span class="mut">Your collector · ⭐ 4.8</span></div><button class="btn s" data-a="call">Call</button></div>`:''}<p><button class="btn o" data-a="adv" ${r.st>=5?'disabled':''}>Advance status (demo)</button></p></div>`,'Pickup tracking','Follow your e-waste from doorstep to recycler.')}
function his(){const q=S.q.toLowerCase(),L=mine().filter(r=>(S.f==='All'||(S.f==='Completed'?r.st===5:r.st<5))&&(!q||(r.id+r.it).toLowerCase().includes(q)));
 return shell(CN,`<div class="row" style="border:0;padding-top:0"><input class="in" id="hq" style="max-width:300px" placeholder="Search by ID or item" value="${e(S.q)}"><select class="in" id="hf" style="max-width:180px">${['All','Completed','In progress'].map(o=>`<option ${S.f===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="card tw" id="ht">${hisT(L)}</div>`,'Pickup history','All your previous requests.')}
function hisT(L){return L.length?`<table><tr><th>Request ID</th><th>Date</th><th>Items</th><th>Weight</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td>${r.id}</td><td>${r.d}</td><td>${e(r.it)}</td><td>${r.w} kg</td><td>${badge(r.st)}</td><td><button class="btn o s" data-a="det" data-v="${r.id}">View Details</button></td></tr>`).join('')}</table>`:`<div class="emp"><i>🔍</i><b>No pickups found</b><br>Try a different search or filter.</div>`}
function imp(){const w=kg(done().reduce((a,r)=>a+r.w,0)),m=[['May',4],['Jun',9],['Jul',6],['Aug',12],['Sep',17],['Oct',3]],mx=17;
 return shell(CN,stat({'E-waste recycled':w+' kg','Devices recycled':14,'CO₂ saved':kg(w*1.5)+' kg','Pickups':mine().length})+`<div class="card"><h3>E-waste recycled per month (kg)</h3><div class="bars" style="margin-bottom:24px">${m.map(x=>`<div style="height:${x[1]/mx*100}%" title="${x[1]} kg"><small>${x[0]}</small></div>`).join('')}</div></div>`,'Your environmental impact','Estimates based on 1.5 kg CO₂ saved per kg recycled.')}

const AN=[['a-ov','Overview','📊'],['a-pk','Pickups','📦'],['a-cu','Customers','👥'],['a-co','Collectors','🚚']];
function aov(){const all=[...R,...X],pts=[8,11,9,14,18,16,21],mx=21;
 return shell(AN,stat({'Total customers':248,'Total pickups':1480+R.length,'Pending pickups':all.filter(r=>r.st<4).length,'Completed pickups':1412,'E-waste collected':'4,260 kg'})+`<div class="grid w"><div class="card"><h3>Pickup trend (last 7 weeks)</h3><svg viewBox="0 0 280 110" style="width:100%"><polyline fill="none" stroke="#2e9e5b" stroke-width="3" stroke-linejoin="round" points="${pts.map((p,i)=>`${10+i*43},${100-p/mx*85}`).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${10+i*43}" cy="${100-p/mx*85}" r="4" fill="#1b8a8f"/>`).join('')}</svg></div><div class="card"><h3>E-waste by category</h3>${[['Laptops',34],['Phones',28],['TVs',16],['Printers',12],['Batteries',10]].map(c=>`<div class="hb"><em>${c[0]}</em><i style="width:${c[1]*2}%"></i>${c[1]}%</div>`).join('')}</div></div><div class="card tw" style="margin-top:14px"><h3>Recent pickup requests</h3>${pkT(all.slice(0,5))}</div>`,'Admin dashboard','Operations overview for Eco Loop Nagpur.')}
function pkT(L){return`<table><tr><th>Request</th><th>Customer</th><th>Date</th><th>Weight</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td>${r.id}</td><td>${r.cu}</td><td>${r.d}</td><td>${r.w} kg</td><td>${badge(r.st)}</td><td>${r.st<2?`<button class="btn s" data-a="asg" data-v="${r.id}">Assign</button>`:''}</td></tr>`).join('')}</table>`}
const apk=()=>shell(AN,`<div class="card tw">${pkT([...R,...X])}</div>`,'Pickup management','Assign collectors to new requests.');
const acu=()=>shell(AN,`<div class="card tw"><table><tr><th>Name</th><th>Email</th><th>City</th><th>Pickups</th><th></th></tr>${CUS.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><button class="btn o s" data-a="toast" data-v="Customer profile is not part of this prototype.">View</button></td></tr>`).join('')}</table></div>`,'Customer management','');
const aco=()=>shell(AN,`<div class="grid w">${COL.map(c=>`<div class="card"><b style="font-size:17px">🚚 ${c[0]}</b><p class="mut">${c[1]} · ${c[3]} active pickups</p><span class="bd ${c[2]==='On duty'?'':'a'}">${c[2]}</span></div>`).join('')}</div>`,'Collector management','Your field team at a glance.');

const NX=['Accept Pickup','Start Pickup','Mark Collected','Complete Pickup'],NS=['Assigned','Accepted','On the way','Collected','Completed'];
function coll(){return shell([['coll','My Pickups','🚚'],['dash','Customer','🙋'],['a-ov','Admin','🛠️']],stat({"Today's pickups":J.length,'Pending pickups':J.filter(j=>j.s<4).length,'Completed pickups':J.filter(j=>j.s===4).length})+J.map((j,i)=>`<div class="card" style="margin-bottom:12px"><div class="row" style="border:0;padding-top:0"><b>${j.id}</b><span class="bd ${j.s<4?'b':''}">${NS[j.s]}</span></div><div class="grid w" style="gap:6px"><div>👤 <b>${j.cu}</b> · ${j.ph}</div><div>📍 ${j.a}</div><div>🗑️ ${j.it} (${j.w} kg)</div><div>🕒 ${j.t}</div></div>${j.s<4?`<p><button class="btn" data-a="job" data-v="${i}">${NX[j.s]}</button></p>`:'<p class="mut">✔ Completed. Great work!</p>'}</div>`).join(''),'Collector dashboard','Hello Ravi, here are your pickups for today.')}
const V={home,login,dash,sch,conf,trk,his,imp,'a-ov':aov,'a-pk':apk,'a-cu':acu,'a-co':aco,coll};
function render(){$('#root').innerHTML=V[S.v]()}

document.addEventListener('click',ev=>{const t=ev.target.closest('[data-go],[data-a],[data-sc]');if(!t)return;
 if(t.dataset.a==='x'&&ev.target.closest('.card'))return;
 if(t.dataset.go)return go(t.dataset.go);
 if(t.dataset.sc){if(S.v!=='home'){S.v='home';render()}S.menu=0;return setTimeout(()=>{render();document.getElementById(t.dataset.sc)?.scrollIntoView()},0)}
 const a=t.dataset.a,v=t.dataset.v;
 if(a==='x'||a==='close')document.querySelector('.mod')?.remove();
 else if(a==='menu'){S.menu=!S.menu;render()}
 else if(a==='theme'){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
 else if(a==='forgot')modal('<h3>Reset password</h3><p class="mut">We will send a reset link to your email.</p><input class="in" value="ananya.iyer@mail.com"><p><button class="btn" data-a="sent">Send link</button></p>');
 else if(a==='sent'){document.querySelector('.mod')?.remove();toast('Reset link sent. Check your inbox.')}
 else if(a==='signup')toast('Sign-up is not part of this prototype. Use the demo login.');
 else if(a==='login'){const em=$('#em').value.trim(),pw=$('#pw').value;$('#ee').textContent=/^\S+@\S+\.\S+$/.test(em)?'':'Enter a valid email address.';$('#pe').textContent=pw.length>=6?'':'Password must be at least 6 characters.';
  if($('#ee').textContent||$('#pe').textContent)return toast('Please fix the highlighted fields.',1);S.load=1;render();setTimeout(()=>{S.load=0;go('dash');toast('Logged in successfully.')},800)}
 else if(a==='cat'){const[i,c]=v.split('|');S.items[i].c=c;render()}
 else if(a==='add'){S.items.push({c:'Phones',n:'',q:1,cond:'Working',w:'',img:''});S.err=0;render();toast('Item added.')}
 else if(a==='rm'){S.items.splice(+v,1);render()}
 else if(a==='date'){S.date=v;S.slot='';render()}
 else if(a==='slot'){S.slot=v;render()}
 else if(a==='back'){S.step--;S.err=0;render()}
 else if(a==='next'){const A=S.addr,ok=S.step===1?S.items.every(i=>i.n.trim()&&+i.w>0&&+i.q>=1):S.step===2?['line','area','city','state','ph'].every(k=>(A[k]||'').trim())&&/^\d{6}$/.test(A.pin||''):!!(S.date&&S.slot);
  if(!ok){S.err=1;render();return toast('Please complete the required fields.',1)}S.err=0;S.step++;render()}
 else if(a==='confirm'){S.load=1;render();setTimeout(()=>{const n=125+R.length-5,id='ECO-20261007-'+String(n).padStart(5,'0');
  R.unshift({id,cu:'Ananya Iyer',d:S.date.slice(4,10),slot:S.slot,it:S.items.map(i=>i.n).join(', '),w:kg(S.items.reduce((a,i)=>a+i.q*i.w,0)),st:0,a:`${S.addr.line}, ${S.addr.area}, ${S.addr.city} ${S.addr.pin}`});
  S.cur=id;S.load=0;S.step=1;S.items=[{c:'Laptops',n:'',q:1,cond:'Working',w:'',img:''}];S.date=S.slot='';go('conf');toast('Pickup request created.')},1100)}
 else if(a==='adv'){const r=R.find(x=>x.id===S.cur);r.st++;render();toast('Status updated: '+SN[r.st])}
 else if(a==='call')toast('Calling collector… (demo)');
 else if(a==='det'){const r=R.find(x=>x.id===v);modal(`<h3>${r.id}</h3><p>${badge(r.st)}</p><div class="row"><span>Date</span><b>${r.d}</b></div><div class="row"><span>Time slot</span><b>${r.slot}</b></div><div class="row"><span>Items</span><b>${e(r.it)}</b></div><div class="row"><span>Weight</span><b>${r.w} kg</b></div><div class="row"><span>Address</span><b style="text-align:right">${e(r.a)}</b></div><p><button class="btn" data-a="close">Close</button></p>`)}
 else if(a==='asg')modal(`<h3>Assign collector</h3><p class="mut">${v}</p><select class="in" id="cs">${COL.filter(c=>c[2]==='On duty').map(c=>`<option>${c[0]}</option>`).join('')}</select><p><button class="btn" data-a="doasg" data-v="${v}">Assign</button> <button class="btn o" data-a="close">Cancel</button></p>`);
 else if(a==='doasg'){const r=[...R,...X].find(x=>x.id===v);r.st=2;const n=$('#cs').value;document.querySelector('.mod').remove();render();toast('Assigned to '+n+'.')}
 else if(a==='job'){const j=J[+v];j.s++;render();toast(j.s===4?'Pickup completed. Nice work!':NS[j.s]+'.')}
 else if(a==='toast')toast(v);
});
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
 if(d.i!==undefined)S.items[d.i][d.k]=t.value;else if(d.ad)S.addr[d.ad]=t.value;
 else if(t.id==='hq'||t.id==='hf'){if(t.id==='hq')S.q=t.value;else S.f=t.value;const q=S.q.toLowerCase();$('#ht').innerHTML=hisT(mine().filter(r=>(S.f==='All'||(S.f==='Completed'?r.st===5:r.st<5))&&(!q||(r.id+r.it).toLowerCase().includes(q))))}
 else if(t.id==='sel'){S.cur=t.value;render()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.img!==undefined&&t.files[0]){S.items[t.dataset.img].img=t.files[0].name;render();toast('Image attached.')}if(t.id==='sel'){S.cur=t.value;render()}});
render();
</script></body></html>
